# Nginx Reverse Proxy Configuration for Foodies Cloud Application
# Features: HTTP -> HTTPS redirect, Gzip compression, static asset caching,
# SSL termination via Let's Encrypt / Certbot, proxy pass to Gunicorn, and request size limiting.

# 1. HTTP Server — Redirect all unencrypted traffic to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name foodies.duckdns.org; # Replace with your DuckDNS domain or EC2 Public DNS

    # Let's Encrypt ACME challenge endpoint for Certbot
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Permanent 301 Redirect to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. HTTPS Server — Secure SSL Reverse Proxy & Static File Accelerator
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name foodies.duckdns.org; # Replace with your DuckDNS domain or EC2 Public DNS

    # SSL Certificate Paths (Managed by Certbot)
    ssl_certificate /etc/letsencrypt/live/foodies.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/foodies.duckdns.org/privkey.pem;

    # Modern TLS Security Configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Max File Upload Size (Enforced at Nginx boundary)
    client_max_body_size 10M;

    # Gzip Compression for Fast Static Delivery
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # Web Root containing static files
    root /home/ubuntu/Foodies-Static;
    index index.html;

    # Access and Error Logging for CloudWatch Agent Ingestion
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # Static Assets Caching (CSS, JS, Images)
    location ~* \.(css|js|jpg|jpeg|png|gif|ico|webp|avif|svg)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
        try_files $uri =404;
    }

    # Health Check Endpoint — Proxied directly to Flask
    location /health {
        proxy_pass http://127.0.0.1:8080/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
    }

    # API Routes — Reverse proxied to Gunicorn / Flask backend
    location /api/ {
        proxy_pass http://127.0.0.1:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }

    # Default fallback: serve static pages or index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
