# Nginx Reverse Proxy Configuration for Foodies Application
# Production Paths: Webroot at /opt/foodies, ACME challenge at /var/www/certbot
#
# NOTE: This configuration starts cleanly BEFORE SSL certificates exist.
# After running Certbot (Step 12 in DEPLOY.md), uncomment the HTTPS block below
# or copy deploy/nginx-https.conf to enable full TLS encryption.

# Rate limit zone: 5 requests per minute per IP for authentication routes
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/m;

server {
    listen 80;
    listen [::]:80;
    server_name YOUR_DOMAIN_NAME; # Replace with your DuckDNS or EC2 domain

    # Hide Nginx version banner from error pages and headers
    server_tokens off;

    # 1. ACME Challenge Webroot for Certbot (Starts cleanly without certificates)
    # Allows Certbot webroot mode to obtain & renew certificates while Nginx is running
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        try_files $uri =404;
    }

    # 2. Strict Security: Block sensitive files, dotfiles, databases, and source code
    # MUST be placed before static and application location blocks
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
        return 404;
    }

    location ~* \.(db|sqlite|sqlite3|log|py|sql|env|pem|key|bak)$ {
        deny all;
        access_log off;
        log_not_found off;
        return 404;
    }

    # 3. Maximum upload payload size enforced at reverse proxy edge
    client_max_body_size 10M;

    # 4. Web root containing static application assets
    root /opt/foodies;
    index index.html;

    # Logging directories matching CloudWatch agent ingestion paths
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # Gzip compression for static performance
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss image/svg+xml;

    # 5. Rate-limited authentication API endpoints
    location /api/auth/ {
        limit_req zone=auth_limit burst=5 nodelay;
        proxy_pass http://127.0.0.1:8080/api/auth/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    # 6. General API proxying to Gunicorn backend
    location /api/ {
        proxy_pass http://127.0.0.1:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }

    # 7. Health and Readiness probes proxied to Flask
    location /health {
        proxy_pass http://127.0.0.1:8080/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /ready {
        proxy_pass http://127.0.0.1:8080/ready;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 8. Static file caching
    location ~* \.(css|js|jpg|jpeg|png|gif|ico|webp|avif|svg)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
        try_files $uri =404;
    }

    # 9. Fallback root routing
    location / {
        try_files $uri $uri/ /index.html;
    }
}
